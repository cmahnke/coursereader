name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - run: npm run validate
      - run: npm run build:all
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@projektemacher/coursereader@$version" version >/dev/null 2>&1; then
            echo "Version $version is already published to npm, skipping"
          else
            npm publish --access public --ignore-scripts
          fi
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name="@cmahnke/coursereader"
          npm config set //npm.pkg.github.com/:_authToken="$NODE_AUTH_TOKEN"
          npm publish --access public --ignore-scripts --registry=https://npm.pkg.github.com
